<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLineChart 测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050608; color: #e0e0e0; font-family: 'JetBrains Mono', monospace; }
  #container { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="container"></div>
<script type="importmap">
{
  "imports": {
    "klinecharts": "/node_modules/klinecharts/dist/index.esm.js"
  }
}
</script>
<script type="module">
import { init } from "klinecharts";

// 生成 mock K 线数据 (最近 200 个交易日)
function generateMockData(count = 200) {
  const data = [];
  let price = 100;
  const now = new Date();
  for (let i = count - 1; i >= 0; i--) {
    const date = new Date(now);
    date.setDate(date.getDate() - i);
    // 跳过周末
    if (date.getDay() === 0 || date.getDay() === 6) continue;

    const change = (Math.random() - 0.48) * 3;
    const open = price;
    const close = price + change;
    const high = Math.max(open, close) + Math.random() * 2;
    const low = Math.min(open, close) - Math.random() * 2;
    const volume = Math.floor(Math.random() * 1000000) + 200000;
    data.push({
      timestamp: date.getTime(),
      open: +open.toFixed(2),
      high: +high.toFixed(2),
      low: +low.toFixed(2),
      close: +close.toFixed(2),
      volume,
    });
    price = close;
  }
  return data;
}

const data = generateMockData(200);

const chart = init("container", {
  locale: "zh-CN",
  timezone: "Asia/Shanghai",
  styles: {
    grid: {
      show: true,
      horizontal: { show: true, color: "rgba(255,255,255,0.08)", style: "solid", size: 0.5 },
      vertical: { show: false },
    },
    candle: {
      type: "candle_solid",
      bar: {
        compareRule: "current_open",
        upColor: "#FF4D4D",
        downColor: "#00FF9D",
        noChangeColor: "#9ca3af",
        upBorderColor: "#CC0000",
        downBorderColor: "#00CC7D",
        noChangeBorderColor: "#9ca3af",
        upWickColor: "#FF4D4D",
        downWickColor: "#00FF9D",
        noChangeWickColor: "#9ca3af",
      },
      priceMark: { show: false },
    },
    xAxis: {
      show: true,
      tickText: { show: true, color: "#6b7280", size: 10 },
    },
    yAxis: {
      show: true,
      tickText: { show: true, color: "#9ca3af", size: 10 },
    },
    separator: {
      size: 1,
      color: "#1f2937",
      fill: true,
      activeBackgroundColor: "rgba(255,255,255,0.03)",
    },
    crosshair: {
      show: true,
      horizontal: {
        show: true,
        line: { show: true, color: "rgba(255,255,255,0.15)", style: "dashed", size: 1 },
        text: { show: true, color: "#e0e0e0", size: 10, backgroundColor: "rgba(5,6,8,0.92)", borderColor: "rgba(255,255,255,0.12)", borderSize: 1, borderRadius: 4, paddingLeft: 6, paddingRight: 6, paddingTop: 2, paddingBottom: 2 },
      },
      vertical: {
        show: true,
        line: { show: true, color: "rgba(255,255,255,0.15)", style: "dashed", size: 1 },
        text: { show: false },
      },
    },
  },
});

if (!chart) {
  document.getElementById("container").textContent = "KLineChart init 返回 null，请检查控制台";
} else {
  // 创建指标 — MA 和 BOLL 叠加在主图蜡烛 pane 上
  const candlePane = { id: "candle_pane" };
  chart.createIndicator({ name: "MA", calcParams: [5, 10, 20, 60, 120] }, { isStack: true, pane: candlePane });
  chart.createIndicator({ name: "BOLL", calcParams: [20, 2] }, { isStack: true, pane: candlePane });
  chart.createIndicator({ name: "VOL", calcParams: [5, 10, 20] });
  chart.createIndicator({ name: "MACD", calcParams: [12, 26, 9] });

  // 加载数据
  chart.setDataLoader({
    getBars: (params) => {
      params.callback(data, false);
    },
  });

  console.log("KLineChart 初始化成功！", chart);
  console.log("数据条数:", data.length);

  // 创建形态标记 overlay 测试
  const mid = Math.floor(data.length / 2);
  const bullId = chart.createOverlay({
    name: "看涨信号测试",
    groupId: "test_bull",
    lock: true,
    mode: "normal",
    visible: true,
    points: [{ timestamp: data[mid].timestamp, value: data[mid].low }],
    styles: {
      point: {
        color: "#FF4D4D",
        borderColor: "#fff",
        borderSize: 1.5,
        radius: 6,
        activeColor: "#FF4D4D",
        activeBorderColor: "#fff",
        activeBorderSize: 2,
        activeRadius: 8,
      },
    },
  });
  console.log("Bull overlay ID:", bullId);

  const bearId = chart.createOverlay({
    name: "看跌信号测试",
    groupId: "test_bear",
    lock: true,
    mode: "normal",
    visible: true,
    points: [{ timestamp: data[mid + 5].timestamp, value: data[mid + 5].high }],
    styles: {
      point: {
        color: "#00FF9D",
        borderColor: "#fff",
        borderSize: 1.5,
        radius: 6,
        activeColor: "#00FF9D",
        activeBorderColor: "#fff",
        activeBorderSize: 2,
        activeRadius: 8,
      },
    },
  });
  console.log("Bear overlay ID:", bearId);
}

// ResizeObserver
const ro = new ResizeObserver(() => chart?.resize());
ro.observe(document.getElementById("container"));
</script>
</body>
</html>
