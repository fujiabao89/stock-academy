services:
  - type: web
    name: stock-academy
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stock-academy-db
          property: connectionString

databases:
  - name: stock-academy-db
    plan: free
