app = "stock-academy"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.prod"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"

[env]
  ENVIRONMENT = "production"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
